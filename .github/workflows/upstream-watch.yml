# Weekly: compare upstream-main with madeyexz/louisa-wifi main through the API.
# Never checks out or pushes upstream code. If upstream changed more than the
# store data, post to one issue assigned to the owner (locked to collaborators).
name: Upstream watch

on:
  schedule:
    - cron: "11 20 * * 2"  # Wednesdays 04:11 Taiwan time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: PipperL
      UPSTREAM: madeyexz:louisa-wifi:main
      TITLE: 上游有新的程式變動
    steps:
      - name: Compare
        run: |
          gh api "repos/$GITHUB_REPOSITORY/compare/upstream-main...$UPSTREAM" > compare.json
          python3 - <<'EOF'
          import json, os, re, subprocess

          c = json.load(open("compare.json"))
          commits = c.get("commits", [])
          if not commits:
              print("upstream-main is up to date")
              raise SystemExit
          head = commits[-1]["sha"]

          def files(sha):
              out = subprocess.run(["gh", "api", f"repos/madeyexz/louisa-wifi/commits/{sha}",
                                    "--jq", "[.files[].filename]"], capture_output=True, text=True, check=True)
              return json.loads(out.stdout)

          code = []
          for cm in commits:
              fs = files(cm["sha"])
              if fs and all(f == "data/stores.json" for f in fs):
                  continue
              code.append((cm, fs))
          if not code:
              print(f"{len(commits)} upstream commits, all store data only")
              raise SystemExit

          sensitive = re.compile(r"URLSession|Process\(|NSWorkspace|open urls|CFBundleURL|associate\(|curl|wget")
          flagged = []
          for f in c.get("files", []):
              name = f["filename"]
              if name.startswith(".github/") or name in ("build.sh", "app/Info.plist", "install.sh"):
                  flagged.append(f"`{name}`")
              elif name.endswith(".swift") and sensitive.search(f.get("patch", "")):
                  flagged.append(f"`{name}`（含網路連線、外部程式或 URL scheme 相關變動）")

          lines = [f"<!-- upstream-head: {head} -->",
                   f"上游 `main` 比 `upstream-main` 多了 {len(commits)} 個 commit，其中 {len(code)} 個不只是門市資料。", ""]
          lines += ["**commit：**"]
          for cm, fs in code:
              msg = cm["commit"]["message"].splitlines()[0]
              lines.append(f"- [`{cm['sha'][:7]}`]({cm['html_url']}) {msg}（{len(fs)} 個檔案）")
          lines += ["", "**需要特別注意的檔案：**"] + ([f"- {x}" for x in flagged] or ["- 無"])
          lines += ["", f"比較：https://github.com/{os.environ['GITHUB_REPOSITORY']}/compare/upstream-main...{os.environ['UPSTREAM']}",
                    "", "審查之後再決定是否更新 `upstream-main`（只 fast-forward）。"]
          open("body.md", "w").write("\n".join(lines) + "\n")
          open("head.txt", "w").write(head)
          EOF
          [ -f body.md ] || exit 0

          head=$(cat head.txt)
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --author app/github-actions \
                    --search "in:title $TITLE" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number")
          if [ -n "$issue" ]; then
            if gh issue view "$issue" -R "$GITHUB_REPOSITORY" --json body,comments \
                 --jq '[.body] + [.comments[].body] | join("\n")' | grep -q "upstream-head: $head"; then
              echo "Already notified for $head"
              exit 0
            fi
            gh issue comment "$issue" -R "$GITHUB_REPOSITORY" --body-file body.md
          else
            url=$(gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --assignee "$OWNER" --body-file body.md)
            gh issue lock "${url##*/}" -R "$GITHUB_REPOSITORY" --reason resolved || \
              gh api -X PUT "repos/$GITHUB_REPOSITORY/issues/${url##*/}/lock" -f lock_reason=resolved
          fi
