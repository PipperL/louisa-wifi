# Personal build: compiles the app and uploads it as a workflow artifact.
# No release, no tag, no publishing.
name: Build

on:
  push:
    branches: [personal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: ./build.sh
      - run: shasum -a 256 build/LouisaWiFi.zip | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: LouisaWiFi-${{ github.sha }}
          path: build/LouisaWiFi.zip
          retention-days: 30
